<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>We Insure Things — Sales Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#e8f1f8; --surface:#ffffff; --surface-2:#f4f8fb;
    --ink:#06121d; --ink-soft:#36485a; --muted:#6b7280;
    --line:#dbe7f1; --line-soft:#eef4fa;
    --navy:#06121d; --amber:#00aeef; --amber-soft:#d6f1fc;       /* WIT Blue + Ink navy */
    --emerald:#15a05c; --emerald-soft:#ddf6e9; --rose:#ff6868;   /* success green for money / positive */
    --shadow:0 1px 2px rgba(6,18,29,.05), 0 10px 30px rgba(0,174,239,.10);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 100% -10%, #cdeefb 0, transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.num{font-family:"Fraunces",Georgia,serif}
  .num{font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer}
  a{color:var(--amber)}

  /* layout */
  .app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  .side{
    background:var(--navy);color:#cfd8e2;padding:26px 20px;
    display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
  .brand .mark{
    width:42px;height:42px;border-radius:13px;flex:none;
    background:linear-gradient(150deg,var(--amber),#007eae);
    display:grid;place-items:center;color:#06121d;font-family:"Fraunces";font-weight:700;font-size:19px;
    box-shadow:0 6px 16px rgba(0,174,239,.4);
  }
  .brand .name{font-family:"Fraunces";color:#fff;font-weight:600;font-size:17px;line-height:1.15}
  .brand .name small{display:block;color:#8aa0b4;font-family:"Hanken Grotesk";font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
  .navbtn{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:transparent;border:0;color:#aebccb;padding:11px 13px;border-radius:10px;
    font-size:14.5px;font-weight:500;transition:.16s;
  }
  .navbtn svg{width:18px;height:18px;flex:none;opacity:.85}
  .navbtn:hover{background:rgba(255,255,255,.06);color:#fff}
  .navbtn.active{background:linear-gradient(135deg,var(--amber),#007eae);color:#fff;font-weight:600}
  .navbtn.active svg{opacity:1}
  .side .spacer{flex:1}
  .side .foot{font-size:11.5px;color:#6f8295;border-top:1px solid rgba(255,255,255,.08);padding-top:14px;line-height:1.5}

  .main{padding:30px 38px 60px;max-width:1200px;width:100%}
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:26px;flex-wrap:wrap}
  .topbar h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-.01em}
  .topbar .sub{color:var(--muted);font-size:13.5px;margin-top:3px}

  .btn{
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;transition:.15s;
    display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow)
  }
  .btn:hover{border-color:#c3bba8;transform:translateY(-1px)}
  .btn.primary{background:linear-gradient(135deg,#06121d,#16293a);color:#fff;border-color:#06121d}
  .btn.primary:hover{box-shadow:0 8px 24px rgba(16,19,26,.28)}
  .btn.amber{background:linear-gradient(135deg,var(--amber),#007eae);color:#fff;border-color:#007eae}
  .btn.ghost{background:transparent;box-shadow:none}
  .btn.danger{color:var(--rose);border-color:#e3c9c6;background:#fbf3f2}
  .btn svg{width:16px;height:16px}

  .grid{display:grid;gap:18px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:20px}
  .kpi{padding:18px 20px;position:relative;overflow:hidden}
  .kpi .lab{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .kpi .val{font-size:30px;font-weight:600;margin-top:8px;letter-spacing:-.02em}
  .kpi .delta{font-size:12.5px;margin-top:6px;color:var(--muted)}
  .kpi.accent .val{color:var(--emerald)}
  .kpi .ico{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2)}
  .kpi .ico svg{width:18px;height:18px;color:var(--ink-soft)}

  .row2{grid-template-columns:1.5fr 1fr}
  .secthead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .secthead h3{margin:0;font-size:17px;font-weight:600}
  .secthead .tag{font-size:12px;color:var(--muted)}

  /* goal */
  .goalbar{height:12px;border-radius:8px;background:var(--surface-2);overflow:hidden;margin-top:14px;border:1px solid var(--line-soft)}
  .goalbar > div{height:100%;background:linear-gradient(90deg,#15a05c,#33d17a);border-radius:8px;transition:width .5s}
  .goalmeta{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:var(--ink-soft)}

  /* table */
  table{width:100%;border-collapse:collapse}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
  th:hover{color:var(--ink)}
  td{padding:12px;border-bottom:1px solid var(--line-soft);font-size:14px;vertical-align:middle}
  tbody tr:hover{background:var(--surface-2)}
  .money{font-family:"Fraunces";font-variant-numeric:tabular-nums;font-weight:500}
  .pos{color:var(--emerald);font-weight:600}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .pill.new{background:var(--amber-soft);color:#007eae}
  .pill.renewal{background:#eef2f7;color:#51607a}
  .pill.bound{background:var(--emerald-soft);color:#15a05c}
  .pill.pending{background:#e3f3fb;color:#0a7290}
  .pill.lost{background:#ffe3e3;color:#d83b3b}
  .iconbtn{border:0;background:transparent;padding:6px;border-radius:7px;color:var(--muted)}
  .iconbtn:hover{background:var(--surface-2);color:var(--ink)}
  .iconbtn.del:hover{color:var(--rose)}
  .iconbtn svg{width:16px;height:16px;display:block}

  .empty{padding:46px 20px;text-align:center;color:var(--muted)}
  .empty svg{width:40px;height:40px;opacity:.4;margin-bottom:8px}

  /* filters */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
  input,select,textarea{
    font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface);
    border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none;transition:.15s;width:100%
  }
  input:focus,select:focus,textarea:focus{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
  .search{position:relative;flex:1;min-width:180px}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
  .search input{padding-left:34px}
  .toolbar select{width:auto;min-width:130px}

  /* todos */
  .todo{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
  .todo:last-child{border-bottom:0}
  .todo .check{width:21px;height:21px;border-radius:6px;border:2px solid var(--line);flex:none;margin-top:1px;display:grid;place-items:center;background:var(--surface);transition:.15s}
  .todo .check:hover{border-color:var(--emerald)}
  .todo.done .check{background:var(--emerald);border-color:var(--emerald)}
  .todo.done .check svg{opacity:1}
  .todo .check svg{width:13px;height:13px;color:#fff;opacity:0}
  .todo .body{flex:1;min-width:0}
  .todo .txt{font-weight:500}
  .todo.done .txt{text-decoration:line-through;color:var(--muted)}
  .todo .meta{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .due.over{color:var(--rose);font-weight:600}
  .prio{width:8px;height:8px;border-radius:50%;display:inline-block}
  .prio.high{background:var(--rose)} .prio.med{background:var(--amber)} .prio.low{background:#9aa6b2}

  /* modal */
  .ov{position:fixed;inset:0;background:rgba(13,20,30,.5);backdrop-filter:blur(3px);display:none;place-items:center;z-index:50;padding:20px}
  .ov.open{display:grid}
  .modal{background:var(--surface);border-radius:18px;width:100%;max-width:620px;max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:pop .2s ease}
  @keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal .mh{display:flex;align-items:center;justify-content:space-between;padding:22px 26px;border-bottom:1px solid var(--line)}
  .modal .mh h2{margin:0;font-size:21px;font-weight:600}
  .modal .mb{padding:24px 26px}
  .modal .mf{padding:18px 26px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:var(--surface-2);border-radius:0 0 18px 18px}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field.full{grid-column:1/-1}
  .field label{font-size:12.5px;font-weight:600;color:var(--ink-soft)}
  .field .hint{font-size:11.5px;color:var(--muted)}
  .commbox{grid-column:1/-1;background:var(--emerald-soft);border:1px solid #b7e6cd;border-radius:11px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
  .commbox .l{font-size:13px;color:#15a05c;font-weight:600}
  .commbox .v{font-family:"Fraunces";font-size:24px;font-weight:600;color:#15a05c}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--navy);color:#fff;padding:13px 20px;border-radius:11px;font-size:14px;font-weight:500;box-shadow:0 16px 40px rgba(0,0,0,.3);z-index:80;transition:.35s cubic-bezier(.2,.9,.3,1);display:flex;align-items:center;gap:10px;max-width:90vw}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast svg{width:18px;height:18px;color:var(--amber)}

  .settings-sec{margin-bottom:8px}
  .settings-sec h3{font-size:15px;margin:0 0 4px}
  .settings-sec p{margin:0 0 14px;color:var(--muted);font-size:13px}
  .chartwrap{position:relative;height:240px}
  .minilegend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--ink-soft)}
  .minilegend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:3px;display:inline-block}

  /* ===== AgencyZoom-style dashboard ===== */
  .panelrow{display:grid;grid-template-columns:1.42fr 1fr;gap:18px;margin-bottom:18px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 24px}
  .panel .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
  .panel .ph h3{margin:0;font-family:"Fraunces";font-size:18px;font-weight:600}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
  .seg button{border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:999px}
  .seg button.on{background:var(--amber);color:#fff;box-shadow:0 2px 6px rgba(0,174,239,.35)}

  .pace{display:grid;grid-template-columns:minmax(190px,1fr) 1.1fr;gap:22px;align-items:center}
  .tiles{display:flex;flex-direction:column;gap:12px}
  .tile{position:relative;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:14px 16px;overflow:hidden}
  .tile .tl{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .tile .tv{font-family:"Fraunces";font-size:25px;font-weight:600;letter-spacing:-.01em;margin-top:3px}
  .tile.dim{background:#eef2f7}
  .tile .tico{position:absolute;right:12px;bottom:8px;opacity:.12}
  .tile .tico svg{width:46px;height:46px;color:var(--ink)}
  .ringwrap{display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring{position:relative;width:230px;height:230px}
  .ring svg{transform:rotate(-90deg)}
  .ring .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .ring .ctr .lab{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .ring .ctr .big{font-family:"Fraunces";font-size:40px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
  .achieved{display:flex;align-items:center;gap:8px;margin-top:16px;color:var(--ink-soft);font-size:13px}
  .achieved .d{width:9px;height:9px;border-radius:50%;background:var(--emerald)}
  .achieved b{font-family:"Fraunces";font-weight:600}

  .mstat{border:1px solid var(--line-soft);border-radius:12px;padding:16px 18px;margin-bottom:12px;background:var(--surface-2)}
  .mstat.row{display:flex;align-items:center;justify-content:space-between}
  .mstat .lab{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .mstat .big{font-family:"Fraunces";font-size:30px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
  .mstat .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .mstat .rt{text-align:right}
  .mstat .pct{font-family:"Fraunces";font-size:26px;font-weight:600}
  .barline{height:6px;border-radius:6px;background:#dfe7f0;overflow:hidden;margin-top:12px}
  .barline > div{height:100%;border-radius:6px}
  .up{color:var(--emerald);font-weight:700} .down{color:var(--rose);font-weight:700}

  .wb{display:grid;grid-template-columns:248px 1fr;gap:22px}
  .wb .filters .fl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  .fbox{border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin-bottom:10px;background:var(--surface)}
  .fbox label{display:block;font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:5px}
  .fbox select{border:0;padding:0;background:transparent;font-weight:600;font-size:14px;cursor:pointer}
  .fbox select:focus{box-shadow:none}
  .metricpills{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .mp{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);display:flex;gap:7px;align-items:center}
  .mp.on{background:var(--amber);border-color:var(--amber);color:#fff}
  .mp .n{font-family:"Fraunces"}

  @media(max-width:980px){ .panelrow{grid-template-columns:1fr} .pace{grid-template-columns:1fr} .ring{width:200px;height:200px} .wb{grid-template-columns:1fr} }

  /* ===== loading bar ===== */
  .loadbar{position:fixed;top:0;left:0;height:3px;width:0;z-index:200;
    background:linear-gradient(90deg,var(--amber),#56c2f5);opacity:0;transition:width .3s ease, opacity .3s}
  .loadbar.on{width:80%;opacity:1;transition:width 8s cubic-bezier(.1,.7,.1,1),opacity .2s}
  .ncbadge{display:inline-block;font-size:11px;font-weight:700;color:#15803d;background:#dcfce7;border-radius:999px;padding:3px 9px;margin-right:6px;vertical-align:middle}
  .iconbtn.nc:hover{color:var(--amber)}

  /* ===== Hot List ===== */
  .hotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .hotcard{position:relative;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--amber);
    border-radius:14px;padding:16px 16px 14px;box-shadow:var(--shadow);transition:.15s}
  .hotcard:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,174,239,.14)}
  .hotcard .top{display:flex;align-items:flex-start;gap:11px}
  .hotcard .emoji{font-size:26px;line-height:1;flex:none}
  .hotcard .nm{font-family:"Fraunces";font-weight:600;font-size:17px;color:var(--ink);word-break:break-word}
  .hotcard .acts{margin-left:auto;display:flex;gap:2px;flex:none}
  .hotcard .action{margin-top:12px;font-size:13.5px;color:var(--ink-soft);display:flex;gap:7px;align-items:flex-start}
  .hotcard .action .muted{color:var(--muted);font-style:italic}
  .hotcard .due{margin-top:9px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
    background:var(--amber-soft);color:#007eae;padding:5px 10px;border-radius:999px}
  .hotcard .due.over{background:#fde7e7;color:#c0392b}
  .hotcard .due.none{background:var(--surface-2);color:var(--muted);font-weight:500}
  .hotmeter{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .hotmeter .bar{flex:1;height:9px;border-radius:6px;background:var(--surface-2);overflow:hidden;max-width:260px;border:1px solid var(--line-soft)}
  .hotmeter .bar > div{height:100%;background:linear-gradient(90deg,var(--amber),#56c2f5);border-radius:6px;transition:width .4s}
  .hotmeter .cnt{font-family:"Fraunces";font-weight:600;font-size:14px}
  .hotmeter .cnt.full{color:var(--rose)}
  .emojipick{display:flex;flex-wrap:wrap;gap:7px}
  .emojipick button{font-size:20px;width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--surface);line-height:1}
  .emojipick button.on{border-color:var(--amber);background:var(--amber-soft);box-shadow:0 0 0 3px rgba(0,174,239,.15)}
  /* ===== login gate ===== */
  .login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;
    background:radial-gradient(900px 500px at 50% -10%, #0a3a55 0, var(--navy) 60%)}
  .login-card{background:var(--surface);border-radius:20px;padding:40px 38px;width:100%;max-width:380px;text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,.4)}
  .login-mark{width:60px;height:60px;border-radius:16px;margin:0 auto 18px;
    background:linear-gradient(150deg,var(--amber),#007eae);color:#06121d;
    font-family:"Fraunces";font-weight:700;font-size:28px;display:grid;place-items:center;
    box-shadow:0 8px 22px rgba(0,174,239,.4)}
  .login-card h1{font-family:"Fraunces";font-size:24px;font-weight:600;margin:0;color:var(--ink)}
  .login-sub{color:var(--muted);font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:4px 0 26px}
  .gbtn-wrap{display:flex;justify-content:center;min-height:44px}
  .login-msg{color:var(--rose);font-size:13px;font-weight:600;margin-top:16px;min-height:18px}
  .login-note{color:var(--muted);font-size:12px;margin-top:22px;border-top:1px solid var(--line-soft);padding-top:16px}
  .userchip{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .userchip img{width:28px;height:28px;border-radius:50%;flex:none}
  .userchip .un{color:#fff;font-size:12.5px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .userchip .ue{color:#8aa0b4;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .signout{background:rgba(255,255,255,.08);border:0;color:#cfe6f5;font-size:12px;font-weight:600;padding:7px 12px;border-radius:8px;width:100%}
  .signout:hover{background:rgba(255,255,255,.15);color:#fff}
  @media(max-width:920px){
    .app{grid-template-columns:1fr}
    .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}
    .side .brand{margin-bottom:0;margin-right:auto}
    .side .navbtn{width:auto} .side .spacer,.side .foot{display:none}
    .kpis{grid-template-columns:repeat(2,1fr)} .row2{grid-template-columns:1fr}
    .main{padding:22px} .fgrid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="login" id="login" style="display:none">
  <div class="login-card">

<script>
/* ------------------------------------------------------------------ *
 *  We Insure Things — Sales Tracker
 *  Backend: wit_app.py (Flask) — detected automatically via /api/config.
 *  Falls back to localStorage when served standalone.
 * ------------------------------------------------------------------ */

const BACKEND = { enabled:false, base:'/api', clientId:'' };
async function detectBackend(){
  try{
    const r = await fetch(`${BACKEND.base}/config`, {credentials:'include'});
    if(r.ok){ const d = await r.json(); BACKEND.enabled = true; BACKEND.clientId = d.clientId || ''; }
  }catch(e){ BACKEND.enabled = false; }
}

const Store = (() => {
  const hasWin = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function');
  async function srvGet(key){
    const r = await fetch(`${BACKEND.base}/kv/${encodeURIComponent(key)}`, {credentials:'include'});
    if(r.status === 404) return undefined;
    if(!r.ok) throw new Error('kv get '+r.status);
    return (await r.json()).value;
  }
  async function srvSet(key, val){
    const r = await fetch(`${BACKEND.base}/kv/${encodeURIComponent(key)}`, {method:'PUT', credentials:'include',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify({value:val})});
    if(!r.ok) throw new Error('kv set '+r.status);
  }
  return {
    async get(key, def){
      try{
        if(BACKEND.enabled){ const v = await srvGet(key); return v===undefined ? def : v; }
        if(hasWin){ const r = await window.storage.get(key); return r ? JSON.parse(r.value) : def; }
        const v = localStorage.getItem(key); return v ? JSON.parse(v) : def;
      }catch(e){ return def; }
    },
    async set(key, val){
      try{
        if(BACKEND.enabled){ await srvSet(key, val); return; }
        if(hasWin){ await window.storage.set(key, JSON.stringify(val)); }
        else { localStorage.setItem(key, JSON.stringify(val)); }
      }catch(e){ console.error('save failed', e); }
    }
  };
})();

const DEFAULT_SETTINGS = {
  agency:'We Insure Things',
  userName:'',
  notifyEmail:'logan@weinsurethings.com',
  fromEmail:'',
  rateNew:12,
  rateRenewal:8,
  monthlyGoal:200000,
  webhook:'',
  webhookToken:'',
  ncAutoPush:false
};

let SALES = [], TODOS = [], HOTLIST = [], SETTINGS = {...DEFAULT_SETTINGS};
let MYGOAL = 0, NCENABLED = false;
const HOT_MAX = 20;
let editingId = null, sort = {key:'date', dir:-1};
const fmt = n => '$' + (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2, maxFractionDigits:2, maximumFractionDigits:2});
const fmt0 = n => '$' + Math.round(Number(n)||0).toLocaleString('en-US');
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayISO = () => new Date().toISOString().slice(0,10);
const monthKey = d => (d||'').slice(0,7);

function commissionOf(s){
  const rate = (s.rate!=='' && s.rate!=null) ? Number(s.rate)
              : (s.type==='Renewal' ? SETTINGS.rateRenewal : SETTINGS.rateNew);
  return (Number(s.premium)||0) * (Number(rate)||0)/100;
}

const AUTH = {
  clientId: '',
  allowedDomains: ['weinsurethings.com'],
  allowedEmails: []
};
let CURRENT_USER = null;

function decodeJwt(t){
  try{
    const b=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    const json=decodeURIComponent(atob(b).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json);
  }catch(e){ return null; }
}
function userAllowed(u){
  if(!u||!u.email) return false;
  const email=u.email.toLowerCase();
  if(AUTH.allowedEmails.map(e=>e.toLowerCase()).includes(email)) return true;
  const dom=(email.split('@')[1]||'');
  return AUTH.allowedDomains.length===0 || AUTH.allowedDomains.map(d=>d.toLowerCase()).includes(dom);
}
async function showLogin(msg){
  document.getElementById('app').style.display='none';
  document.getElementById('login').style.display='grid';
  if(msg) document.getElementById('loginMsg').textContent=msg;
  const clientId = BACKEND.enabled ? (BACKEND.clientId || AUTH.clientId) : AUTH.clientId;
  if(!clientId){ document.getElementById('loginMsg').textContent='Sign-in is not configured.'; return; }
  let tries=0;
  (function init(){
    if(window.google && google.accounts && google.accounts.id){
      google.accounts.id.initialize({client_id:clientId, callback:onCredential, auto_select:true});
      google.accounts.id.renderButton(document.getElementById('gbtn'),
        {theme:'filled_blue', size:'large', shape:'pill', text:'signin_with', width:280});
      google.accounts.id.prompt();
    } else if(tries++<60){ setTimeout(init,100); }
    else { document.getElementById('loginMsg').textContent='Could not load Google Sign-In.'; }
  })();
}
async function onCredential(resp){
  if(BACKEND.enabled){
    try{
      const r = await fetch(`${BACKEND.base}/auth/google`, {method:'POST', credentials:'include',
        headers:{'Content-Type':'application/json'}, body:JSON.stringify({credential:resp.credential})});
      const d = await r.json().catch(()=>({}));
      if(r.ok){ CURRENT_USER=d.user; document.getElementById('login').style.display='none'; initApp(); return; }
      document.getElementById('loginMsg').textContent = d.error ? ('Sign-in blocked: '+d.error) : 'Sign-in failed.';
    }catch(e){ document.getElementById('loginMsg').textContent='Could not reach the server.'; }
    return;
  }
  const p=decodeJwt(resp.credential);
  const u=p?{email:p.email, name:p.name, picture:p.picture, sub:p.sub}:null;
  if(!u){ document.getElementById('loginMsg').textContent='Sign-in failed. Try again.'; return; }
  if(!userAllowed(u)){ document.getElementById('loginMsg').textContent=u.email+' is not authorized for this agency.'; return; }
  CURRENT_USER=u; await Store.set('wit_user', u);
  document.getElementById('login').style.display='none';
  initApp();
}
function signOut(){
  if(BACKEND.enabled){ fetch(`${BACKEND.base}/logout`,{method:'POST',credentials:'include'}).finally(()=>location.reload()); return; }
  Store.set('wit_user', null); CURRENT_USER=null;
  try{ google.accounts.id.disableAutoSelect(); }catch(e){}
  location.reload();
}

let demoMode = false;
async function boot(){
  await detectBackend();
  if(BACKEND.enabled){
    try{
      const r = await fetch(`${BACKEND.base}/me`, {credentials:'include'});
      if(r.ok){ CURRENT_USER = (await r.json()).user; initApp(); return; }
    }catch(e){}
    showLogin(); return;
  }
  CURRENT_USER = await Store.get('wit_user', null);
  if(AUTH.clientId && !userAllowed(CURRENT_USER)){ showLogin(); return; }
  initApp();
}
async function initApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='';
  if(BACKEND.enabled){
    SALES = (await api('GET','/sales')).sales || [];
    TODOS = (await api('GET','/todos')).todos || [];
    HOTLIST = (await api('GET','/hotlist')).hotlist || [];
    SETTINGS = {...DEFAULT_SETTINGS, ...((await api('GET','/settings')).value || {})};
    try{ NCENABLED = !!(await api('GET','/integrations')).nowcerts; }catch(e){ NCENABLED=false; }
    try{ MYGOAL = Number((await api('GET','/prefs')).value?.goal) || 0; }catch(e){ MYGOAL=0; }
    board.scope = (CURRENT_USER && CURRENT_USER.role==='admin') ? 'agency' : 'mine';
  } else {
    SALES = await Store.get('wit_sales', []);
    TODOS = await Store.get('wit_todos', []);
    HOTLIST = await Store.get('wit_hotlist', []);
    SETTINGS = {...DEFAULT_SETTINGS, ...(await Store.get('wit_settings', {}))};
    const seeded = await Store.get('wit_seeded', false);
    if(!seeded && !SALES.length){
      SALES = seedDemo(); TODOS = seedTodos(); demoMode = true;
      await Store.set('wit_seeded', true); save.sales(); save.todos();
    }
  }
  renderSideFoot();
  document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.nav)));
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  go('dashboard');
}
function renderSideFoot(){
  const f=document.getElementById('sideFoot'); if(!f) return;
  if(CURRENT_USER){
    f.innerHTML=`<div class="userchip">${CURRENT_USER.picture?`<img src="${esc(CURRENT_USER.picture)}" referrerpolicy="no-referrer" alt="">`:''}
      <div style="min-width:0"><div class="un">${esc(CURRENT_USER.name||CURRENT_USER.email)}</div><div class="ue">${esc(CURRENT_USER.email)}</div></div></div>
      <button class="signout" data-action="signout">Sign out</button>`;
  } else {
    f.innerHTML='Data is saved to this browser/app. Use <strong>Settings → Export</strong> to back up.';
  }
}
function seedDemo(){
  const mi=monthInfo(), pad=n=>String(n).padStart(2,'0');
  const D=d=>`${mi.y}-${pad(mi.m+1)}-${pad(Math.min(d, mi.day||1))}`;
  const lastM=new Date(mi.y, mi.m-1, 15).toISOString().slice(0,10);
  const lines=['Auto','Home','Bundle (Auto+Home)','Commercial','Renters','Life','Umbrella'];
  const carriers=['Progressive','Safeco','Travelers','Nationwide','Foremost','Liberty Mutual'];
  const rows=[
    ['Laura T',2400,1,'New'],['Laura T',3100,2,'New'],['Laura T',5200,3,'New'],['Laura T',2900,5,'Renewal'],['Laura T',2658,6,'New'],
    ['Logan W',1800,1,'New'],['Logan W',4200,2,'New'],['Logan W',3600,4,'Renewal'],['Logan W',2700,5,'New'],['Logan W',1700,6,'New'],
    ['Chase S',2100,2,'New'],['Chase S',3300,3,'New'],['Chase S',1500,5,'Renewal'],['Chase S',2700,6,'New'],
    ['Heather C',1900,1,'New'],['Heather C',2600,3,'New'],['Heather C',1700,5,'Renewal'],['Heather C',1700,6,'New'],
    ['Sergio H',1500,2,'New'],['Sergio H',1400,4,'New'],['Sergio H',1700,6,'Renewal'],
  ];
  let i=0;
  const arr=rows.map(([p,prem,d,type])=>({id:uid()+(i++),date:D(d),producer:p,
    customer:p.split(' ')[0]+' household '+i, line:lines[i%lines.length], carrier:carriers[i%carriers.length],
    type, status:'Bound', premium:prem, rate:'', notes:'', createdAt:new Date().toISOString()}));
  arr.push({id:uid()+'pq',date:D(mi.day||1),producer:'Logan W',customer:'Riverside Logistics',line:'Commercial',carrier:'Travelers',type:'New',status:'Pending',premium:5400,rate:'',notes:'Awaiting signed app',createdAt:new Date().toISOString()});
  [['Laura T',8200],['Logan W',7600],['Chase S',5100],['Heather C',4200],['Sergio H',3100]].forEach((x,k)=>
    arr.push({id:uid()+'lm'+k,date:lastM,producer:x[0],customer:x[0]+' (prior month)',line:'Auto',carrier:'Progressive',type:'New',status:'Bound',premium:x[1],rate:'',notes:'',createdAt:new Date().toISOString()}));
  return arr;
}
function seedTodos(){
  return [
    {id:uid()+'t1',text:'Follow up with Riverside Logistics on signed app',due:todayISO(),prio:'high',done:false},
    {id:uid()+'t2',text:'Call Heather about cross-sell on auto renewals',due:'',prio:'med',done:false},
    {id:uid()+'t3',text:'Send June production recap to leadership',due:'',prio:'low',done:false},
  ];
}
const save = {
  sales:()=>Store.set('wit_sales',SALES),
  todos:()=>Store.set('wit_todos',TODOS),
  settings:()=>Store.set('wit_settings',SETTINGS)
};

let _pending=0;
function setLoading(on){
  _pending=Math.max(0,_pending+(on?1:-1));
  const b=document.getElementById('loadbar'); if(b) b.classList.toggle('on', _pending>0);
}
async function api(method, path, body){
  const opt={method, credentials:'include', headers:{}};
  if(body!==undefined){ opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(body); }
  setLoading(true);
  try{
    const r=await fetch(BACKEND.base+path, opt);
    if(r.status===401){ location.reload(); throw new Error('session expired'); }
    if(!r.ok){ let m=''; try{ m=(await r.json()).error||''; }catch(e){} throw new Error(m||(method+' '+path+' → '+r.status)); }
    return r.status===204 ? null : r.json();
  } finally { setLoading(false); }
}

const Data = {
  async addSale(d){
    if(BACKEND.enabled){ const rec=(await api('POST','/sales',d)).sale; SALES.unshift(rec); return rec; }
    const rec={id:uid(),...d,createdAt:new Date().toISOString()}; SALES.push(rec); save.sales(); return rec;
  },
  async updateSale(id,d){
    if(BACKEND.enabled){ const rec=(await api('PATCH','/sales/'+id,d)).sale; const i=SALES.findIndex(s=>s.id===id); if(i>=0) SALES[i]=rec; return rec; }
    const i=SALES.findIndex(s=>s.id===id); SALES[i]={...SALES[i],...d}; save.sales(); return SALES[i];
  },
  async deleteSale(id){
    if(BACKEND.enabled) await api('DELETE','/sales/'+id);
    SALES=SALES.filter(s=>s.id!==id); if(!BACKEND.enabled) save.sales();
  },
  async addTodo(t){
    if(BACKEND.enabled){ const rec=(await api('POST','/todos',t)).todo; TODOS.push(rec); return rec; }
    const rec={id:uid(),...t,done:false}; TODOS.push(rec); save.todos(); return rec;
  },
  async toggleTodo(id){
    const t=TODOS.find(x=>x.id===id); if(!t) return;
    t.done=!t.done; t.completed_at=t.done?new Date().toISOString():null;
    if(BACKEND.enabled) await api('PATCH','/todos/'+id,{done:t.done}); else { t.completedAt=t.completed_at; save.todos(); }
  },
  async deleteTodo(id){
    if(BACKEND.enabled) await api('DELETE','/todos/'+id);
    TODOS=TODOS.filter(x=>x.id!==id); if(!BACKEND.enabled) save.todos();
  },
  async clearDone(){
    const done=TODOS.filter(t=>t.done);
    if(BACKEND.enabled) for(const t of done) await api('DELETE','/todos/'+t.id);
    TODOS=TODOS.filter(t=>!t.done); if(!BACKEND.enabled) save.todos();
  },
  async saveSettings(){
    if(BACKEND.enabled) await api('PUT','/settings',{value:SETTINGS}); else save.settings();
  },
  async savePrefs(){
    if(BACKEND.enabled) await api('PUT','/prefs',{value:{goal:MYGOAL}});
  },
  async addHot(h){
    if(HOTLIST.length>=HOT_MAX) throw new Error('full');
    if(BACKEND.enabled){ const rec=(await api('POST','/hotlist',h)).item; HOTLIST.push(rec); return rec; }
    const rec={id:uid(),emoji:'🔥',...h,created_at:new Date().toISOString()}; HOTLIST.push(rec); saveHotLocal(); return rec;
  },
  async updateHot(id,h){
    if(BACKEND.enabled){ const rec=(await api('PATCH','/hotlist/'+id,h)).item; const i=HOTLIST.findIndex(x=>x.id===id); if(i>=0) HOTLIST[i]=rec; return rec; }
    const i=HOTLIST.findIndex(x=>x.id===id); HOTLIST[i]={...HOTLIST[i],...h}; saveHotLocal(); return HOTLIST[i];
  },
  async deleteHot(id){
    if(BACKEND.enabled) await api('DELETE','/hotlist/'+id);
    HOTLIST=HOTLIST.filter(x=>x.id!==id); if(!BACKEND.enabled) saveHotLocal();
  }
};

let board = {metric:'premium', time:'MTD', type:'', carrier:'', scope:'agency'};

function monthInfo(){
  const now=new Date();
  return {y:now.getFullYear(), m:now.getMonth(), day:now.getDate(),
    days:new Date(now.getFullYear(), now.getMonth()+1, 0).getDate(),
    key:now.toISOString().slice(0,7),
    label:now.toLocaleDateString('en-US',{month:'long'})};
}
const sumPrem = list => list.reduce((a,s)=>a+(Number(s.premium)||0),0);
const mineFilter = list => (board.scope==='mine' && CURRENT_USER) ? list.filter(s=>s.created_by===CURRENT_USER.email) : list;

async function getSummary(){
  if(BACKEND.enabled) return await api('GET','/report/summary?scope='+board.scope);
  const mi=monthInfo();
  const bound=mineFilter(SALES.filter(s=>s.status==='Bound'));
  const lmKey=new Date(mi.y,mi.m-1,1).toISOString().slice(0,7);
  const mtdList=bound.filter(s=>monthKey(s.date)===mi.key);
  const goal = board.scope==='mine' ? (Number(MYGOAL)||0) : (Number(SETTINGS.monthlyGoal)||0);
  return {goal, day:mi.day, daysInMonth:mi.days,
    mtdPremium:sumPrem(mtdList), mtdCount:mtdList.length,
    todayPremium:sumPrem(bound.filter(s=>s.date===todayISO())),
    lastMonthPremium:sumPrem(bound.filter(s=>monthKey(s.date)===lmKey))};
}
async function getLeaderboard(){
  if(BACKEND.enabled) return await api('GET','/report/leaderboard?'+new URLSearchParams(
    {scope:board.scope, metric:board.metric, period:board.time, type:board.type, carrier:board.carrier}).toString());
  let list=mineFilter(SALES.filter(s=>s.status==='Bound'));
  const mi=monthInfo();
  if(board.time==='MTD') list=list.filter(s=>monthKey(s.date)===mi.key);
  else if(board.time==='YTD') list=list.filter(s=>(s.date||'').slice(0,4)===String(mi.y));
  if(board.type) list=list.filter(s=>s.type===board.type);
  if(board.carrier) list=list.filter(s=>s.carrier===board.carrier);
  const mv=s=> board.metric==='policies'?1:(board.metric==='revenue'?commissionOf(s):(Number(s.premium)||0));
  const by={}; list.forEach(s=>{const k=s.producer||'Unassigned'; by[k]=(by[k]||0)+mv(s);});
  return {metric:board.metric, totals:{premium:sumPrem(list), policies:list.length, revenue:list.reduce((a,s)=>a+commissionOf(s),0)},
    rows:Object.entries(by).map(([producer,value])=>({producer,value})).sort((a,b)=>b.value-a.value)};
}

function filteredSales(){
  return SALES.filter(s=>{
    if(salesFilter.status && s.status!==salesFilter.status) return false;
    if(salesFilter.type && s.type!==salesFilter.type) return false;
    if(salesFilter.q){
      const q=salesFilter.q.toLowerCase();
      const hay=[s.customer,s.carrier,s.producer,s.line,s.notes].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b)=>{
    let x=a[sort.key], y=b[sort.key];
    if(sort.key==='premium'){x=Number(x)||0;y=Number(y)||0;}
    if(sort.key==='commission'){x=commissionOf(a);y=commissionOf(b);}
    if(x<y) return -1*sort.dir; if(x>y) return 1*sort.dir; return 0;
  });
}

  const rows=filteredSales();

  const dlabel = h.due ? new Date(h.due+'T00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}) : '';
  const dueHtml = h.due
    ? `<div class="due ${over?'over':''}">${over?'🚨 Overdue · ':'📅 '}${dlabel}</div>`
    : `<div class="due none">📅 No date set</div>`;
  return `<div class="hotcard">
    <div class="top">
      <span class="emoji">${esc(h.emoji||'🔥')}</span>
      <span class="nm">${esc(h.name)}</span>
      <span class="acts">
        <button class="iconbtn" data-action="editHot" data-id="${h.id}" title="Edit">${editIco()}</button>
        <button class="iconbtn del" data-action="delHot" data-id="${h.id}" title="Remove">${trashIco()}</button>
      </span>
    </div>
    <div class="action">📌 ${h.action?esc(h.action):'<span class="muted">No next action yet</span>'}</div>
    ${dueHtml}
  </div>`;
}
function openHot(id){
  editingHot = id || null;
  const h = id ? HOTLIST.find(x=>x.id===id) : null;
  if(!h && HOTLIST.length>=HOT_MAX){ toast('Hot list is full ('+HOT_MAX+' max) 🔥'); return; }
  hotEmoji = h ? (h.emoji||'🔥') : '🔥';
  document.getElementById('hotTitle').textContent = h?'🔥 Edit prospect':'🔥 Add to Hot List';
  document.getElementById('saveHotBtn').textContent = h?'Save changes':'Add to hot list';
  document.getElementById('h_name').value = h?h.name:'';
  document.getElementById('h_action').value = h?(h.action||''):'';
  document.getElementById('h_due').value = h?(h.due||''):'';
  renderEmojiPicker();
  toggleOv('hotOv',true);
  setTimeout(()=>document.getElementById('h_name').focus(),50);
}
function renderEmojiPicker(){
  document.getElementById('h_emojis').innerHTML = HOT_EMOJIS.map(e=>
    `<button data-action="hotEmoji" data-id="${e}" class="${e===hotEmoji?'on':''}">${e}</button>`).join('');
}
async function saveHot(){
  const name=document.getElementById('h_name').value.trim();
  if(!name){ document.getElementById('h_name').focus(); return; }
  const payload={name, emoji:hotEmoji, action:document.getElementById('h_action').value.trim(), due:document.getElementById('h_due').value};
  try{
    if(editingHot) await Data.updateHot(editingHot, payload);
    else await Data.addHot(payload);
    toggleOv('hotOv',false); go('hotlist');
    toast(editingHot?'Prospect updated':hotEmoji+' Added to your hot list');
  }catch(err){
    if(String(err.message).includes('full')||String(err).includes('409')) toast('Hot list is full ('+HOT_MAX+' max) 🔥');
    else { console.error(err); toast('Could not save'); }
  }
}

function onClick(e){
  const th=e.target.closest('th[data-sort]');
  if(th && current==='sales'){ const k=th.dataset.sort; sort.dir = sort.key===k ? -sort.dir : (k==='premium'||k==='commission'||k==='date'?-1:1); sort.key=k; renderSalesTable(); return; }
  const el=e.target.closest('[data-action]'); if(!el) return;
  const id=el.dataset.id, a=el.dataset.action;
  ({
    boardMetric:()=>{ board.metric=id; document.querySelectorAll('.mp').forEach(p=>p.classList.toggle('on',p.dataset.id===id)); drawBoard(); },
    clearSample:()=>{ SALES=[]; TODOS=[]; demoMode=false; save.sales(); save.todos(); toast('Sample data cleared'); go('dashboard'); },
    signout:()=>signOut(),
    openSale:()=>openSale(),
    editSale:()=>openSale(id),
    closeSale:()=>toggleOv('saleOv',false),
    saveSale:()=>saveSale(),
    delSale:async()=>{ if(!confirm('Delete this sale?')) return;
      const prev=[...SALES]; SALES=SALES.filter(s=>s.id!==id); go(current);
      try{ if(BACKEND.enabled) await api('DELETE','/sales/'+id); else save.sales(); }
      catch(e){ SALES=prev; go(current); toast(e.message||'Delete failed'); } },
    scope:()=>{ board.scope=id; go('dashboard'); },
    reloadApp:()=>initApp(),
    ncTest:async()=>{
      const m=document.getElementById('ncTestMsg'); if(m){ m.textContent='Testing…'; m.style.color='var(--muted)'; }
      try{ await api('POST','/nowcerts/test'); if(m){ m.textContent='✓ Connected'; m.style.color='var(--emerald)'; } toast('NowCerts connection OK'); }
      catch(e){ if(m){ m.textContent='✕ '+(e.message||'failed'); m.style.color='var(--rose)'; } }
    },
    pushNc:async()=>{
      const s=SALES.find(x=>x.id===id); if(!s) return;
      toast('Pushing to NowCerts…');
      try{
        await api('POST','/sales/'+id+'/push-nowcerts');
        s.nc_pushed_at=new Date().toISOString();
        go(current); toast('✓ Sent to NowCerts');
      }catch(e){ toast('NowCerts: '+(e.message||'push failed')); }
    },
    openTodo:()=>{ document.getElementById('t_text').value=''; document.getElementById('t_due').value=''; document.getElementById('t_prio').value='med'; toggleOv('todoOv',true); setTimeout(()=>document.getElementById('t_text').focus(),50); },
    openHot:()=>openHot(),
    editHot:()=>openHot(id),
    closeHot:()=>toggleOv('hotOv',false),
    saveHot:()=>saveHot(),
    hotEmoji:()=>{ hotEmoji=id; renderEmojiPicker(); },
    delHot:async()=>{ if(confirm('Remove this prospect from your hot list?')){ await Data.deleteHot(id); go('hotlist'); } },
    closeTodo:()=>toggleOv('todoOv',false),
    saveTodo:()=>saveTodo(),
    toggleTodo:async()=>{ await Data.toggleTodo(id); go('todos'); },
    delTodo:async()=>{ await Data.deleteTodo(id); go('todos'); },
    clearDone:async()=>{ await Data.clearDone(); go('todos'); },
    saveSettings:()=>saveSettings(),
    exportCsv:()=>exportCsv(),
    exportJson:()=>exportJson(),
    importJson:()=>document.getElementById('importFile').click(),
    wipe:async()=>{ if(confirm('Erase ALL sales, to-dos and settings? This cannot be undone.')){
      if(BACKEND.enabled){ for(const s of [...SALES]) await api('DELETE','/sales/'+s.id); for(const t of [...TODOS]) await api('DELETE','/todos/'+t.id); SETTINGS={...DEFAULT_SETTINGS}; await Data.saveSettings(); SALES=[]; TODOS=[]; }
      else { SALES=[];TODOS=[];SETTINGS={...DEFAULT_SETTINGS}; demoMode=false; Store.set('wit_seeded',true); save.sales();save.todos();save.settings(); }
      go('dashboard'); toast('All data erased'); } }
  }[a]||(()=>{}))();
}

function openSale(id){
  editingId=id||null;
  const s = id ? SALES.find(x=>x.id===id) : null;
  document.getElementById('saleTitle').textContent = s?'Edit Sale':'Log a Sale';
  document.getElementById('saveSaleBtn').textContent = s?'Save changes':'Save sale';
  const v=(k,d='')=>s?(s[k]??d):d;
  document.getElementById('f_date').value = v('date',todayISO());
  document.getElementById('f_producer').value = v('producer', (CURRENT_USER && (CURRENT_USER.name||CURRENT_USER.email)) || '');
  document.getElementById('f_customer').value = v('customer');
  document.getElementById('f_line').value = v('line','Auto');
  document.getElementById('f_carrier').value = v('carrier');
  document.getElementById('f_type').value = v('type','New');
  document.getElementById('f_status').value = v('status','Bound');
  document.getElementById('f_premium').value = v('premium');
  document.getElementById('f_rate').value = (s && s.rate!=='' && s.rate!=null)?s.rate:'';
  document.getElementById('f_notes').value = v('notes');
  updateCommPreview();
  toggleOv('saleOv',true);
  setTimeout(()=>document.getElementById('f_customer').focus(),50);
}
function readSaleForm(){
  return {
    date:document.getElementById('f_date').value||todayISO(),
    producer:document.getElementById('f_producer').value.trim(),
    customer:document.getElementById('f_customer').value.trim(),
    line:document.getElementById('f_line').value,
    carrier:document.getElementById('f_carrier').value.trim(),
    type:document.getElementById('f_type').value,
    status:document.getElementById('f_status').value,
    premium:parseFloat(document.getElementById('f_premium').value)||0,
    rate:document.getElementById('f_rate').value===''?'':parseFloat(document.getElementById('f_rate').value),
    notes:document.getElementById('f_notes').value.trim()
  };
}
function updateCommPreview(){
  const d=readSaleForm();
  document.getElementById('f_commPreview').textContent = fmt(commissionOf(d));
}
async function saveSale(){
  const d=readSaleForm();
  if(!d.customer){ toast('Add a customer name'); document.getElementById('f_customer').focus(); return; }
  try{
    if(editingId){
      await Data.updateSale(editingId, d);
      toggleOv('saleOv',false); go(current); toast('Sale updated');
    }else{
      const sale=await Data.addSale(d);
      toggleOv('saleOv',false); go(current);
      toast('Sale logged · '+fmt0(commissionOf(sale))+' commission');
      if(d.status!=='Lost') sendSaleNotification(sale);
      if(NCENABLED && SETTINGS.ncAutoPush && sale.status==='Bound'){
        try{ await api('POST','/sales/'+sale.id+'/push-nowcerts'); sale.nc_pushed_at=new Date().toISOString(); if(current==='sales'||current==='dashboard') go(current); toast('✓ Synced to NowCerts'); }
        catch(e){ toast('NowCerts auto-push failed — push it manually from the Sales Log'); }
      }
    }
  }catch(e){ console.error(e); toast('Could not save — check your connection'); }
}

async function saveTodo(){
  const text=document.getElementById('t_text').value.trim();
  if(!text){ document.getElementById('t_text').focus(); return; }
  try{
    await Data.addTodo({text, due:document.getElementById('t_due').value, prio:document.getElementById('t_prio').value});
    toggleOv('todoOv',false); go('todos');
  }catch(e){ console.error(e); toast('Could not save to-do'); }
}

function buildEmail(sale){
  const comm=commissionOf(sale);
  const subject=`New sale: ${sale.customer} · ${sale.line} · ${fmt0(sale.premium)}`;
  const body=
`A new sale was logged in the ${SETTINGS.agency} tracker.

Customer:    ${sale.customer}
Producer:    ${sale.producer||'—'}
Line:        ${sale.line}
Carrier:     ${sale.carrier||'—'}
Type:        ${sale.type}
Status:      ${sale.status}
Premium:     ${fmt(sale.premium)}
Commission:  ${fmt(comm)}
Date:        ${sale.date}
Notes:       ${sale.notes||'—'}`;
  return {subject,body};
}
async function sendSaleNotification(sale){
  if(!SETTINGS.notifyEmail){ return; }
  const {subject,body}=buildEmail(sale);
  const hook = SETTINGS.webhook || (BACKEND.enabled ? BACKEND.base+'/notify' : '');
  if(hook){
    try{
      const headers={'Content-Type':'application/json'};
      if(SETTINGS.webhookToken) headers['X-WIT-Token']=SETTINGS.webhookToken;
      const res=await fetch(hook,{method:'POST',credentials:'include',headers,
        body:JSON.stringify({notify:SETTINGS.notifyEmail,from:SETTINGS.fromEmail,subject,body,
          agency:SETTINGS.agency, sale:{...sale, commission:commissionOf(sale)}})});
      if(!res.ok) throw new Error('HTTP '+res.status);
      toast('Notification sent to '+SETTINGS.notifyEmail);
    }catch(err){ console.error(err); toast('Webhook failed — opening mail app'); openMailto(subject,body); }
  }else{
    openMailto(subject,body);
  }
}
function openMailto(subject,body){
  const url=`mailto:${encodeURIComponent(SETTINGS.notifyEmail)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  try{ window.open(url,'_blank'); }catch(e){ location.href=url; }
}

function download(name,content,type){
  const blob=new Blob([content],{type}); const u=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u);
}
function exportCsv(){
  if(!SALES.length){ toast('No sales to export'); return; }
  const head=['Date','Producer','Customer','Line','Carrier','Type','Status','Premium','Rate%','Commission','Notes'];
  const rows=SALES.map(s=>[s.date,s.producer,s.customer,s.line,s.carrier,s.type,s.status,s.premium,
    (s.rate!==''&&s.rate!=null)?s.rate:(s.type==='Renewal'?SETTINGS.rateRenewal:SETTINGS.rateNew),
    commissionOf(s).toFixed(2),(s.notes||'').replace(/\n/g,' ')]
    .map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(','));
  download('wit-sales-'+todayISO()+'.csv',[head.join(','),...rows].join('\n'),'text/csv');
  toast('CSV exported');
}
function exportJson(){
  download('wit-tracker-backup-'+todayISO()+'.json',JSON.stringify({sales:SALES,todos:TODOS,settings:SETTINGS},null,2),'application/json');
  toast('Backup downloaded');
}
function doImport(e){
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=async()=>{ try{
    const d=JSON.parse(r.result);
    if(BACKEND.enabled){
      if(d.settings){ SETTINGS={...DEFAULT_SETTINGS,...d.settings}; await Data.saveSettings(); }
      for(const s of (d.sales||[])) await api('POST','/sales',s);
      for(const t of (d.todos||[])) await api('POST','/todos',t);
      await initApp();
    } else {
      if(d.sales) SALES=d.sales; if(d.todos) TODOS=d.todos; if(d.settings) SETTINGS={...DEFAULT_SETTINGS,...d.settings};
      save.sales();save.todos();save.settings(); go('dashboard');
    }
    toast('Backup imported');
  }catch(err){ console.error(err); toast('Could not import that file'); } };
  r.readAsText(file); e.target.value='';
}
